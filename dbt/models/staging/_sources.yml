version: 2

sources:
  - name: raw
    description: Parquet files written by the Dagster ingest assets (data/raw).
    tables:
      - name: trip_updates
        description: One file per GTFS-realtime snapshot; next stop for each active trip.
        meta:
          dagster: {asset_key: ["raw", "trip_updates"]}
          external_location: "read_parquet('{{ env_var('TRANSIT_RAW_DIR', '../data/raw') }}/trip_updates/*/*.parquet', hive_partitioning = true, union_by_name = true)"
      - name: weather
        meta:
          dagster: {asset_key: ["raw", "weather_hourly"]}
          external_location: "read_parquet('{{ env_var('TRANSIT_RAW_DIR', '../data/raw') }}/weather/weather.parquet')"
      - name: gtfs_routes
        meta:
          dagster: {asset_key: ["raw", "gtfs_routes"]}
          external_location: "read_parquet('{{ env_var('TRANSIT_RAW_DIR', '../data/raw') }}/gtfs/routes.parquet')"
      - name: gtfs_stops
        meta:
          dagster: {asset_key: ["raw", "gtfs_stops"]}
          external_location: "read_parquet('{{ env_var('TRANSIT_RAW_DIR', '../data/raw') }}/gtfs/stops.parquet')"
