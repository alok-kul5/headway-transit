name: transit
version: "1.0.0"
profile: transit
config-version: 2

model-paths: ["models"]
test-paths: ["tests"]
macro-paths: ["macros"]
target-path: "target"
clean-targets: ["target", "dbt_packages"]

vars:
  agency_timezone: "America/New_York"
  # A vehicle counts as on time from 1 minute early to 5 minutes late
  # (the window most US transit agencies report against).
  on_time_early_s: 60
  on_time_late_s: 300
  # Only predictions for a stop the vehicle reaches within this many seconds
  # are treated as its current delay.
  max_horizon_s: 600

models:
  transit:
    staging:
      +materialized: view
      +schema: staging
    intermediate:
      +materialized: view
      +schema: intermediate
    marts:
      +materialized: table
      +schema: marts

tests:
  transit:
    +severity: error
